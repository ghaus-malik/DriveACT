# Road cross-section shared by all tracks (metres).
lane_width: 3.5               # two lanes (one per direction); the route follows the right lane
sidewalk_width: 3.0
curb_height: 0.15
wall_height: 1.10             # concrete wall behind the sidewalk (seen by the LiDAR)
wall_thickness: 0.35
junction_corner_radius: 6.0   # curb fillet radius at intersection corners (> sidewalk_width)
stub_length: 24.0             # length of intersection arms that are not on the route (dead ends)
route_spacing: 0.5            # route polyline resolution
min_curve_radius: 12.0        # axis radius; inner wall radius = R - 3.5 - 3.0 must stay positive
layout_clearance: 3.0         # free space required between non-adjacent road corridors
marking:
  width: 0.15
  dash_length: 3.0
  dash_gap: 5.0
  edge_inset: 0.30
