name: "Track 1 - basic road navigation"
description: Straights, gentle curves and two 90-degree corners; no obstacles.
speed_limit: 11.0             # m/s
pieces:                       # canonical layout (layout seed 0); [straight, length] [curve, axis radius, angle deg (+ left)]
  - [straight, 50]
  - [curve, 45, 40]
  - [straight, 40]
  - [curve, 16, -90]
  - [straight, 60]
  - [curve, 60, -25]
  - [straight, 35]
  - [curve, 16, 90]
  - [straight, 55]
variation:                    # applied to every layout seed except 0
  length_jitter: 0.2          # relative
  radius_jitter: 0.15
  angle_jitter_deg: 10.0      # gentle curves only (|angle| < 80 deg)
  mirror_prob: 0.5            # mirror all turn directions
start:
  s: 3.0
  lateral_jitter: 0.4
  heading_jitter_deg: 4.0
goal_margin: 12.0             # the goal is this far before the end of the route
splits:
  train: [0, 1, 2, 3, 4, 5, 6, 7]
  test: [1000, 1001, 1002, 1003]
obstacles:
  groups: {}
